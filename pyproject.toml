[project]
name = "ift3700-6758"
version = "0.1.0"
description = "Démonstrations de science des données pour IFT3700 et IFT6758"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.7.1,<3.8",
    "numpy==1.26.4",
    "pandas==1.5.3",
    "plotly>=6.0,<7",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2,<0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=8,<9",
    "jupyterlab>=4.6.3",
    "tornado>=6.5.10,<7",
    "matplotlib-inline<0.2",
]
llm = [
    "accelerate>=1,<2",
    "bitsandbytes>=0.45,<1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "faiss-cpu>=1.8,<2",
    "langchain-text-splitters>=0.3,<0.4",
    "pandasai==2.3.2",
    "sentence-transformers>=3,<4",
    "torch>=2.6,<3",
    "transformers>=4.45,<5",
]
